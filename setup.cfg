[metadata]
name = aitextcleaner-formatting-residue
version = 0.1.0
description = Local formatting-residue cleanup helper for copied text.
url = https://aitextcleaner.pro/
license_files = LICENSE
project_urls =
    Homepage = https://aitextcleaner.pro/
    Repository = https://aitextcleaner.pro/
    Source = https://aitextcleaner.pro/

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    aitextcleaner-formatting-residue = aitextcleaner_formatting_residue.cli:main
